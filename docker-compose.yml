# KarmaChain — 工具容器（功能 002 / T080）
#
# **本文件不再启动链。** 链由每个故障边界一份的生成物启动：
#   docker/compose/<deployment>-<domain>.yml   ← 由 blockchain/protocol.json 生成
# 走 scripts/devnet-start（它按 KARMACHAIN_DOMAIN 选出本机那一份）。
#
# 这里只放**不属于任何故障边界**的一次性工具容器：验证与生成。
# 它们无状态、不参与共识、不持有链数据，因此不在崩溃恢复路径上。
#
# 001 的 `devnet` 服务（单容器内由 Avalanche CLI 编排 7 个节点）已于 T080 退役 ——
# 它是缺陷 A 的载体：链状态的存续依赖容器收到 SIGTERM 后 `avalanche network stop`
# 成功写出快照，任何非优雅终止都必然绕过该路径。理由与代价见
# docs/adr/0008-runtime-without-orchestration-cli.md。

name: karmachain-devnet

services:
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: docker/verify/Dockerfile
    image: karmachain/verify:local
    working_dir: /workspace
    volumes:
      - ./blockchain:/workspace/blockchain:ro
      - ./tools:/workspace/tools:ro
      - ./tests:/workspace/tests:ro
      - ./specs:/workspace/specs:ro
      - ./.devnet:/workspace/.devnet
    environment:
      # 验证器自行读取 blockchain/protocol.json 得到路径；这里只告知容器内端口。
      # 逐节点检查需要接到节点所在的容器网络上，scripts/devnet-verify 用
      # `docker run --network karmachain` 起容器，不走本文件。
      KARMACHAIN_RPC_PORT: "${KARMACHAIN_CONTAINER_RPC_PORT:-8545}"
    command: ["npm", "run", "verify"]

  # 生成器（功能 002 / US5）。与 verify 用同一镜像，区别只在挂载权限：
  # 生成物必须可写，而 verify 刻意把 blockchain/ 挂成只读（它不该改任何东西）。
  #
  # 为什么要有这个服务：README 承诺"宿主唯一前置依赖是 Docker"，但"改协议参数"那条流程
  # 一直让人跑 npm run protocol:render —— 那需要宿主装 Node。这个服务补上该缺口，
  # 让 scripts/devnet-render 在只有 Docker 的机器上也能用。
  render:
    profiles: ["render"]
    build:
      context: .
      dockerfile: docker/verify/Dockerfile
    image: karmachain/verify:local
    working_dir: /workspace
    volumes:
      - ./blockchain:/workspace/blockchain          # 读声明，写 genesis/ nodes/ compose.env
      - ./docs:/workspace/docs                      # 写 protocol-parameters.md 与 public/
      - ./docker/compose:/workspace/docker/compose  # 写每边界 compose 与 active.env
      - ./tools:/workspace/tools:ro
    command: ["node", "tools/protocol/render-all.mjs"]
