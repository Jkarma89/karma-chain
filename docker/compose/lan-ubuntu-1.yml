# 部署形态 lan · 故障边界 ubuntu-1（linux, 192.168.1.21）
#
# 本文件只描述这一个故障边界。每台机器跑自己那份，机器之间没有编排依赖。

x-node: &node
  image: karmachain/node:local
  build:
    context: ../..
    dockerfile: docker/node/Dockerfile
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "/opt/karmachain/healthcheck.sh"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  l1-3:
    <<: *node
    container_name: karmachain-l1-3
    depends_on:
      primary-1:
        condition: service_healthy
    volumes:
      - karmachain-l1-3-data:/data
      - ../../blockchain/validators/dev/node-3/:/keys:ro
      - ../../blockchain/nodes/lan/l1-3.flags.json:/config/flags.json:ro
      - ../../blockchain/nodes/l1-3.identity.json:/config/identity.json:ro
      - ../../blockchain/nodes/aliases.json:/config/aliases.json:ro
      - ../../blockchain/nodes/chain-config:/config/chains:ro
      - ../../blockchain/chain-identity/primary-network.genesis.json:/config/primary-network.genesis.json:ro
      - ../../blockchain/chain-identity/karmachain.identity.json:/config/karmachain.identity.json:ro
      - ../../blockchain/protocol.json:/config/protocol.json:ro
      - ../../blockchain/genesis/karmachain.genesis.json:/config/karmachain.genesis.json:ro
      - ../../blockchain/genesis/karmachain.genesis.hash:/config/karmachain.genesis.hash:ro
    ports:
      - "21664:21664"
      - "21665:21665"

  primary-1:
    <<: *node
    container_name: karmachain-primary-1
    volumes:
      - karmachain-primary-1-data:/data
      - ../../blockchain/validators/dev/primary-1/:/keys:ro
      - ../../blockchain/nodes/lan/primary-1.flags.json:/config/flags.json:ro
      - ../../blockchain/nodes/primary-1.identity.json:/config/identity.json:ro
      - ../../blockchain/nodes/aliases.json:/config/aliases.json:ro
      - ../../blockchain/nodes/chain-config:/config/chains:ro
      - ../../blockchain/chain-identity/primary-network.genesis.json:/config/primary-network.genesis.json:ro
      - ../../blockchain/chain-identity/karmachain.identity.json:/config/karmachain.identity.json:ro
      - ../../blockchain/protocol.json:/config/protocol.json:ro
      - ../../blockchain/genesis/karmachain.genesis.json:/config/karmachain.genesis.json:ro
      - ../../blockchain/genesis/karmachain.genesis.hash:/config/karmachain.genesis.hash:ro
    ports:
      - "21650:21650"
      - "21651:21651"

  rpc:
    image: nginx:alpine
    container_name: karmachain-rpc-ubuntu-1
    restart: unless-stopped
    volumes:
      - ../../blockchain/nodes/lan/rpc-proxy.conf:/etc/nginx/conf.d/karmachain.conf:ro
    ports:
      - "8545:8545"
    depends_on:
      - l1-3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8545/_alive"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  karmachain-l1-3-data:
    name: karmachain-l1-3-data
  karmachain-primary-1-data:
    name: karmachain-primary-1-data
